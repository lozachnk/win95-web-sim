<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/components.css">
  </head>
  <body>
    <!-- TODO: Switch to desktopEnv after making window functions -->
    <div id="desktopEnv"></div>

    <div class="start-menu panel">
      <div class="title-strip">
        <img src="styles/icons/system/start/start-brand.png" alt="" class="start-brand"/>
      </div>

      <div class="start-content">
        <div class="pinned start-list"> </div>
        <div class="main-list start-list"></div>
        <div class="system-actions start-list">
          <div class="menu-item" id="log-off" data-type="system">
            <img src="styles/icons/system/start/logoff.png" class="list-icon" alt="">
            <p>Log off...</p>
          </div>
          <div class="menu-item" id="power-options" data-type="system">
            <img src="styles/icons/system/start/shutdown.png" class="list-icon" alt="">
            <p>Shut down...</p>
          </div>
        </div>
      </div>
    </div>

    <div class="taskbar">
      <div class="start-side">
        <button class="primary start-btn">
          <img src="styles/icons/system/taskbar/start-logo.png" alt="">
          Start
        </button>
        <div class="pinned-apps">
        </div>
        <div class="running-apps"></div>
      </div>
        
      <div class="sys-side">12:00</div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
